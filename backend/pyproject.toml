[project]
name = "bia-agent-platform"
version = "0.1.0"
description = "Internal platform to create and trace AI agents"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "jsonschema>=4.26.0",
    "openai>=3.42.0",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.2",
    "sqlalchemy>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "T20", "ANN", "D"]
ignore = [
    "D100", # module docstrings are not part of the project's docstring rules
    "D104", # package __init__.py files are intentionally empty
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.vercel]
entrypoint = "bia.api.main:app"
